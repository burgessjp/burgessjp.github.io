<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Range Chart · 美国地图标注测距</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<style>
:root{
  --bg:#0a0e15;
  --panel:#0f141d;
  --panel2:#151b27;
  --line:#1e2735;
  --ink:#dbe2ee;
  --dim:#66738a;
  --amber:#f2a33c;
  --amber-hi:#ffc46b;
  --amber-dim:rgba(242,163,60,.12);
  --red:#e35d5d;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --disp:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",Arial,sans-serif;
  --body:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  display:flex;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:14px;
}
/* ===== 侧栏 ===== */
#side{
  width:300px;flex:none;position:relative;z-index:1000;
  display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.012) 2px 3px),
    var(--panel);
  border-right:1px solid var(--line);
}
#side::after{ /* 图框角标 */
  content:"";position:absolute;inset:10px;pointer-events:none;opacity:.55;
  background:
    linear-gradient(var(--amber),var(--amber)) left 0 top 0/12px 1px,
    linear-gradient(var(--amber),var(--amber)) left 0 top 0/1px 12px,
    linear-gradient(var(--amber),var(--amber)) right 0 top 0/12px 1px,
    linear-gradient(var(--amber),var(--amber)) right 0 top 0/1px 12px,
    linear-gradient(var(--amber),var(--amber)) left 0 bottom 0/12px 1px,
    linear-gradient(var(--amber),var(--amber)) left 0 bottom 0/1px 12px,
    linear-gradient(var(--amber),var(--amber)) right 0 bottom 0/12px 1px,
    linear-gradient(var(--amber),var(--amber)) right 0 bottom 0/1px 12px;
  background-repeat:no-repeat;
}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 16px}
.brand svg{flex:none;color:var(--amber);opacity:.9}
.brand h1{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.18em;color:var(--ink)}
.brand p{font-size:10px;letter-spacing:.28em;color:var(--dim);margin-top:3px}
.search{padding:0 20px 12px}
.search-row{display:flex;gap:6px}
#searchInput{
  flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:2px;
  color:var(--ink);font:12px var(--body);padding:8px 10px;outline:none;transition:.15s;
}
#searchInput:focus{border-color:var(--amber)}
#searchInput::placeholder{color:#454f61}
#searchBtn{
  width:33px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);border-radius:2px;color:var(--dim);transition:.15s;
}
#searchBtn:hover{color:var(--amber-hi);border-color:var(--amber)}
#searchResults{list-style:none;margin-top:6px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);overflow:hidden}
.sr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(30,39,53,.5);cursor:pointer}
.sr:last-child{border-bottom:none}
.sr:hover{background:rgba(242,163,60,.07)}
.sr .sr-name{flex:1;min-width:0;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .mini{flex:none}
.sr-status{padding:10px;font-size:11px;color:var(--dim);text-align:center}
.sr-foot{padding:5px 10px;font-size:9px;color:#3f4a5c;border-top:1px solid var(--line);text-align:right}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 20px 0}
.mode-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 0;font-family:var(--body);font-size:13px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  cursor:pointer;transition:.15s;border-radius:2px;
}
.mode-btn svg{opacity:.7}
.mode-btn:hover{border-color:#2c3a50;color:var(--ink)}
.mode-btn.active{
  border-color:var(--amber);color:var(--amber-hi);
  background:var(--amber-dim);box-shadow:inset 0 0 14px rgba(242,163,60,.08);
}
.hint{padding:12px 20px 10px;font-size:11px;line-height:1.8;color:var(--dim);min-height:58px}
.hint b{color:var(--amber);font-weight:400}
.list-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.3em;color:var(--dim);
}
#count{font-family:var(--mono);letter-spacing:.05em;color:var(--amber)}
#list{flex:1;overflow-y:auto;list-style:none}
#list::-webkit-scrollbar{width:4px}
#list::-webkit-scrollbar-thumb{background:var(--line)}
.row{
  display:flex;align-items:center;gap:10px;padding:9px 20px;
  border-bottom:1px solid rgba(30,39,53,.5);cursor:pointer;transition:.12s;
}
.row:hover{background:var(--panel2)}
.row .idx{
  flex:none;width:22px;height:22px;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;color:var(--dim);transition:.12s;
}
.row.in-path .idx{border-color:var(--amber);color:var(--amber-hi);background:var(--amber-dim)}
.row .meta{flex:1;min-width:0}
.row .name{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .name input{
  width:100%;background:var(--bg);border:1px solid var(--amber);border-radius:2px;
  color:var(--ink);font:13px var(--body);padding:1px 4px;outline:none;
}
.row .coords{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.row .acts{display:flex;gap:4px;opacity:0;transition:.12s}
.row:hover .acts{opacity:1}
.mini{
  font-family:var(--body);font-size:10px;padding:3px 7px;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid var(--line);color:var(--dim);transition:.12s;
}
.mini:hover{border-color:var(--amber);color:var(--amber-hi)}
.mini.del:hover{border-color:var(--red);color:var(--red)}
.empty{
  margin:16px 20px;padding:22px 10px;text-align:center;font-size:12px;color:var(--dim);
  border:1px dashed var(--line);border-radius:3px;letter-spacing:.1em;
}
.measure-ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 20px;border-top:1px solid var(--line)}
.side-foot{padding:12px 20px 16px;border-top:1px solid var(--line)}
.danger{
  width:100%;padding:8px 0;background:transparent;border:1px solid var(--line);
  color:var(--dim);font-size:12px;cursor:pointer;border-radius:2px;transition:.12s;letter-spacing:.1em;
}
.danger:hover{border-color:var(--red);color:var(--red)}
/* ===== 地图区 ===== */
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
#mapwrap::after{ /* 暗角 */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:800;
  box-shadow:inset 0 0 140px rgba(4,6,10,.75);
}
.mode-mark .leaflet-grab{cursor:crosshair}
.mode-measure .leaflet-grab{cursor:default}
/* HUD 状态条 */
#hud{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:900;
  display:flex;align-items:center;gap:14px;
  background:rgba(15,20,29,.9);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:3px;padding:10px 18px;
  box-shadow:0 8px 30px rgba(0,0,0,.45);white-space:nowrap;
}
.hud-cell{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:225px;text-align:center;letter-spacing:.03em}
.hud-sep{width:1px;height:16px;background:var(--line)}
.unit-toggle{display:flex;gap:2px}
.unit-toggle button{
  font-family:var(--mono);font-size:11px;padding:3px 10px;cursor:pointer;border-radius:2px;
  background:transparent;border:1px solid transparent;color:var(--dim);transition:.12s;
}
.unit-toggle button.active{border-color:var(--amber);color:var(--amber-hi);background:var(--amber-dim)}
#routeToggle button{font-family:var(--body);font-size:11px}
#routeToggle button.fail{border-color:var(--red);color:var(--red)}
.hud-total{display:flex;align-items:baseline;gap:10px}
.hud-total label{font-size:9px;letter-spacing:.3em;color:var(--dim)}
.hud-total b{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--amber-hi);min-width:150px}
/* ===== Leaflet 覆写 ===== */
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{
  background:rgba(10,14,21,.8)!important;color:#4a5468!important;
  font-size:9px!important;border-radius:2px 0 0 0;
}
.leaflet-control-attribution a{color:#5d6a80!important}
.leaflet-bar a{
  background:var(--panel)!important;color:var(--ink)!important;
  border-bottom:1px solid var(--line)!important;
}
.leaflet-bar a:hover{background:var(--panel2)!important;color:var(--amber-hi)!important}
.home-ctrl button{
  display:block;width:26px;height:26px;border:none;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:9px;color:var(--ink);letter-spacing:.05em;
}
.home-ctrl button:hover{color:var(--amber-hi)}
/* 标注：准星航点 */
.leaflet-marker-icon.cm-wrap{background:none;border:none}
.cm{
  position:relative;width:26px;height:26px;border:1px solid var(--amber);border-radius:50%;
  background:rgba(10,14,21,.87);display:flex;align-items:center;justify-content:center;
  color:var(--amber-hi);font:700 10px var(--mono);box-shadow:0 2px 10px rgba(0,0,0,.6);
  transition:transform .15s,background .15s,box-shadow .15s;
}
.cm::before,.cm::after{
  content:"";position:absolute;left:50%;width:1px;height:5px;background:var(--amber);
}
.cm::before{top:-6px}
.cm::after{bottom:-6px}
.cm:hover{transform:scale(1.18);box-shadow:0 0 16px rgba(242,163,60,.55)}
.cm.on{background:var(--amber);color:#0a0e15}
.cm.on::before,.cm.on::after{background:var(--amber-hi)}
.mode-measure .cm{cursor:pointer}
/* 搜索定位临时光标 */
.cm.locate{border-style:dashed;color:transparent;font-size:0}
.cm.locate::before,.cm.locate::after{background:var(--amber-hi)}
@keyframes locate-ping{0%{transform:scale(.6);opacity:.9}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.cm.locate .ping{position:absolute;inset:-1px;border:1px solid var(--amber-hi);border-radius:50%;animation:locate-ping 1.6s ease-out infinite}
.pulse{
  position:absolute;inset:-1px;border:1px solid var(--amber);border-radius:50%;
  pointer-events:none;animation:pulse-out .8s ease-out forwards;
}
@keyframes pulse-out{to{transform:scale(2.8);opacity:0}}
/* 测距路径 */
.seg-line{filter:drop-shadow(0 0 4px rgba(242,163,60,.45));animation:march 1.5s linear infinite}
.drive-line{filter:drop-shadow(0 0 5px rgba(242,163,60,.5))}
/* 底图反色：亮色 OSM → 暗色航图（色相保持、明度翻转） */
.basemap-dark{filter:invert(1) hue-rotate(180deg) saturate(.55) brightness(.95) contrast(1.08)}
/* 底图切换控件 */
#basemapSwitch{position:absolute;top:14px;right:14px;z-index:900;display:flex;flex-direction:column;gap:6px}
#basemapSwitch button{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(15,20,29,.9);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:3px;
  color:var(--dim);transition:.15s;
}
#basemapSwitch button:hover{color:var(--ink);border-color:#2c3a50}
#basemapSwitch button.active{border-color:var(--amber);color:var(--amber-hi);box-shadow:0 0 12px rgba(242,163,60,.25)}
/* 亮色底图时减弱暗角 */
body.bm-light #mapwrap::after{box-shadow:inset 0 0 140px rgba(4,6,10,.3)}
.pop-acts a.mini{display:inline-block;text-decoration:none;line-height:1.5}
@keyframes march{to{stroke-dashoffset:-28}}
.seg-tip{
  background:var(--panel)!important;border:1px solid var(--amber)!important;
  border-radius:2px;color:var(--amber-hi)!important;
  font-family:var(--mono)!important;font-size:11px!important;
  box-shadow:0 4px 14px rgba(0,0,0,.5)!important;padding:3px 8px!important;
}
.seg-tip::before{display:none}
/* 弹窗 */
.chart-pop .leaflet-popup-content-wrapper{
  background:var(--panel);border:1px solid var(--line);border-radius:3px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);color:var(--ink);
}
.chart-pop .leaflet-popup-content{margin:13px 16px;line-height:1.5}
.chart-pop .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
.pop-name{font-size:14px;font-weight:600;color:var(--amber-hi);outline:none}
.pop-name[contenteditable="true"]{background:var(--bg);border:1px solid var(--amber);border-radius:2px;padding:1px 5px}
.pop-coords{font-family:var(--mono);font-size:10px;color:var(--dim);margin:4px 0 10px}
.pop-acts{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:820px){
  #side{width:240px}
  .hud-cell{min-width:150px}
}
</style>
</head>
<body class="mode-mark">

<aside id="side">
  <header class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.2">
      <circle cx="15" cy="15" r="12"/>
      <circle cx="15" cy="15" r="7" stroke-dasharray="2 3"/>
      <path d="M15 1v6M15 23v6M1 15h6M23 15h6"/>
      <path d="M15 8L17.5 15L15 22L12.5 15Z" fill="currentColor" stroke="none" opacity=".85"/>
    </svg>
    <div>
      <h1>US RANGE CHART</h1>
      <p>美国地图 · 标注与测距</p>
    </div>
  </header>

  <div class="search">
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="英文地名，如 New York" autocomplete="off" spellcheck="false">
      <button id="searchBtn" title="搜索">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/>
        </svg>
      </button>
    </div>
    <ul id="searchResults" hidden></ul>
  </div>

  <div class="mode-switch">
    <button id="modeMark" class="mode-btn active">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="6.5" cy="6.5" r="4.5"/><path d="M6.5 0v3M6.5 10v3M0 6.5h3M10 6.5h3"/>
      </svg>标注
    </button>
    <button id="modeMeasure" class="mode-btn">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M1 9L9 1l3 3L4 12 1 12Z"/><path d="M3.5 6.5l3 3"/>
      </svg>测距
    </button>
  </div>

  <p class="hint" id="hint"></p>

  <div class="list-head"><span>标注 WAYPOINTS</span><span id="count">0</span></div>
  <ul id="list"></ul>

  <div class="measure-ctl" id="measureCtl" hidden>
    <button class="mini" id="undoPath">移除上一点</button>
    <button class="mini" id="clearPath">清空路径</button>
  </div>
  <footer class="side-foot">
    <button class="danger" id="clearAll">清空全部标注</button>
  </footer>
</aside>

<main id="mapwrap">
  <div id="map"></div>
  <div id="basemapSwitch">
    <button data-bm="dark" class="active" title="暗色航图">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M13.5 9.5A6 6 0 1 1 6.5 2.5a5 5 0 0 0 7 7Z"/>
      </svg>
    </button>
    <button data-bm="sat" title="卫星影像">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="8" cy="8" r="5.5"/>
        <path d="M2.5 8h11M8 2.5c-2.2 2-2.2 9 0 11M8 2.5c2.2 2 2.2 9 0 11"/>
      </svg>
    </button>
    <button data-bm="light" title="亮色街道">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="8" cy="8" r="3"/>
        <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M13 3l-1.4 1.4M4.4 11.6L3 13"/>
      </svg>
    </button>
  </div>
  <div id="hud">
    <span class="hud-cell" id="cursorPos">——</span>
    <span class="hud-sep"></span>
    <div class="unit-toggle" id="routeToggle">
      <button data-route="straight" class="active">直线</button>
      <button data-route="drive">驾驶</button>
    </div>
    <span class="hud-sep"></span>
    <div class="unit-toggle" id="unitToggle">
      <button data-unit="km" class="active">KM</button>
      <button data-unit="mi">MI</button>
    </div>
    <span class="hud-sep"></span>
    <span class="hud-total"><label>TOTAL</label><b id="total">0</b></span>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
'use strict';
const LS_KEY = 'us-range-chart-v1';
const US_CENTER = [39.5, -98.35];

/* ---------- 状态 ---------- */
const state = { markers: [], next: 1, path: [], unit: 'km', mode: 'mark', basemap: 'dark', routeMode: 'straight' };
// markers: [{id, name, lat, lng}]  path: [id,...]

function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      v: 1, markers: state.markers, next: state.next, path: state.path,
      unit: state.unit, basemap: state.basemap, routeMode: state.routeMode
    }));
  } catch (e) { /* 隐私模式等场景静默降级 */ }
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY));
    if (!d || !Array.isArray(d.markers)) return;
    state.markers = d.markers.filter(m => typeof m.lat === 'number' && typeof m.lng === 'number');
    state.next = d.next || state.markers.length + 1;
    state.path = (d.path || []).filter(id => state.markers.some(m => m.id === id));
    state.unit = d.unit === 'mi' ? 'mi' : 'km';
    if (BASEMAPS[d.basemap]) state.basemap = d.basemap;
    state.routeMode = d.routeMode === 'drive' ? 'drive' : 'straight';
  } catch (e) { /* 损坏数据视为空 */ }
}

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
function havKm(a, b) {
  const R = 6371, d2r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * d2r, dLng = (b.lng - a.lng) * d2r;
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * d2r) * Math.cos(b.lat * d2r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function fmtDist(km) {
  const v = state.unit === 'km' ? km : km * 0.621371;
  const d = v >= 100 ? 0 : v >= 10 ? 1 : 2;
  return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' ' + state.unit;
}
function fmtLatLng(lat, lng) {
  return Math.abs(lat).toFixed(4) + '°' + (lat >= 0 ? 'N' : 'S') + '  ' +
         Math.abs(lng).toFixed(4) + '°' + (lng >= 0 ? 'E' : 'W');
}
const byId = id => state.markers.find(m => m.id === id);

/* ---------- 地图 ---------- */
const map = L.map('map', { zoomControl: false, worldCopyJump: true, maxZoom: 19 });
L.control.zoom({ position: 'bottomright' }).addTo(map);
// 底图数据源：全部 Esri 企业 CDN、免 key；dark = Street Map + CSS 反色
const BASEMAPS = {
  dark: {
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 19, className: 'basemap-dark',
            attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, USGS, NGA' }
  },
  sat: {
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 19,
            attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, Maxar, Earthstar Geographics' }
  },
  light: {
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    opts: { maxZoom: 19,
            attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, USGS, NGA' }
  }
};
let tileLayer = null;
function setBasemap(key) {
  if (!BASEMAPS[key]) key = 'dark';
  state.basemap = key;
  if (tileLayer) tileLayer.remove();
  const bm = BASEMAPS[key];
  tileLayer = L.tileLayer(bm.url, bm.opts).addTo(map);
  document.querySelectorAll('#basemapSwitch button').forEach(b =>
    b.classList.toggle('active', b.dataset.bm === key));
  document.body.classList.remove('bm-dark', 'bm-sat', 'bm-light');
  document.body.classList.add('bm-' + key);
  save();
}
$('#basemapSwitch').addEventListener('click', e => {
  const btn = e.target.closest('[data-bm]');
  if (btn) setBasemap(btn.dataset.bm);
});

// 回到美国全图 / 适配全部标注
const HomeCtrl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control home-ctrl');
    div.innerHTML = '<button title="回到全图">US</button>';
    L.DomEvent.disableClickPropagation(div.firstChild);
    L.DomEvent.on(div.firstChild, 'click', fitAll);
    return div;
  }
});
map.addControl(new HomeCtrl());

function fitAll() {
  if (state.markers.length) {
    map.fitBounds(L.latLngBounds(state.markers.map(m => [m.lat, m.lng])), { padding: [70, 70] });
  } else {
    map.setView(US_CENTER, 4);
  }
}

/* ---------- 标注图层 ---------- */
const layer = new Map();          // id -> L.Marker
const pathLine = { line: null, tips: [] };

function iconHtml(id) {
  return '<div class="cm-wrap"><div class="cm' + (state.path.includes(id) ? ' on' : '') + '">' + id +
         '<i class="pulse"></i></div></div>';
}
function markerIcon(m) {
  return L.divIcon({
    html: iconHtml(m.id), className: '', iconSize: [26, 26], iconAnchor: [13, 13]
  });
}
function popupHtml(m) {
  return '<div class="pop" data-id="' + m.id + '">' +
    '<div class="pop-name" data-act="name">' + escapeHtml(m.name) + '</div>' +
    '<div class="pop-coords">' + fmtLatLng(m.lat, m.lng) + '</div>' +
    '<div class="pop-acts">' +
    '<a class="mini" target="_blank" rel="noopener" data-act="sv" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + m.lat + ',' + m.lng + '">街景</a>' +
    '<button class="mini" data-act="rename">重命名</button>' +
    '<button class="mini del" data-act="del">删除</button></div></div>';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function createLayer(m) {
  const mk = L.marker([m.lat, m.lng], {
    draggable: true, icon: markerIcon(m), riseOnHover: true
  }).addTo(map);
  mk.bindPopup(L.popup({ closeButton: false, className: 'chart-pop', offset: [0, -12], autoPanPadding: [30, 30] })
    .setContent(popupHtml(m)));
  mk.on('click', e => { L.DomEvent.stopPropagation(e); onMarkerClick(m.id); });
  mk.on('dragstart', () => { draggingNow = true; });
  mk.on('drag', () => {          // 拖动实时刷新距离（驾驶模式下临时显示直线）
    const p = mk.getLatLng();
    m.lat = p.lat; m.lng = p.lng;
    updateRowCoords(m); renderPath();
  });
  mk.on('dragend', () => {           // 经度归一化，防止跨日界线拖拽后出现未包裹坐标
    const p = mk.getLatLng();
    m.lat = p.lat;
    m.lng = ((p.lng + 540) % 360) - 180;
    mk.setLatLng([m.lat, m.lng]);
    draggingNow = false;
    updateRowCoords(m); renderPath(); save();   // 松手后重新请求驾驶路线
  });
  layer.set(m.id, mk);
}
function refreshMarkerStyles() {
  for (const m of state.markers) {
    const el = layer.get(m.id);
    if (el) el.setIcon(markerIcon(m));
  }
}

/* ---------- 路径渲染（直线 / 驾驶双模式） ---------- */
const ROUTE_APIS = [   // 主：FOSSGIS（OSM 官网路由同款）；备：OSRM 官方 demo
  u => 'https://routing.openstreetmap.de/routed-car/route/v1/driving/' + u + '?overview=full&geometries=geojson',
  u => 'https://router.project-osrm.org/route/v1/driving/' + u + '?overview=full&geometries=geojson'
];
let routeData = null;            // {key, geometry:[[lat,lng],...], legs:[m], distance:m, duration:s}
let routeFetching = false, routeFailed = false, draggingNow = false;

function routeKey(pts) {
  return pts.map(p => p.lat.toFixed(5) + ',' + p.lng.toFixed(5)).join(';');
}
async function fetchRoute(coords) {
  const u = coords.map(c => c.lng + ',' + c.lat).join(';');
  for (const mk of ROUTE_APIS) {
    try {
      const r = await fetch(mk(u));
      if (!r.ok) continue;
      const d = await r.json();
      if (d.code === 'Ok' && d.routes && d.routes[0]) return d.routes[0];
    } catch (e) { /* 换下一个源 */ }
  }
  return null;
}
async function fetchRouteAsync(key, pts) {
  if (routeFetching) return;
  routeFetching = true; routeFailed = false; updateRouteFail();
  const r = await fetchRoute(pts);
  routeFetching = false;
  if (!r) { routeFailed = true; updateRouteFail(); return; }
  routeData = {
    key,
    geometry: r.geometry.coordinates.map(c => [c[1], c[0]]),
    legs: r.legs.map(l => l.distance),
    distance: r.distance, duration: r.duration
  };
  updateRouteFail();
  if (state.routeMode === 'drive' && routeKey(state.path.map(byId).filter(Boolean)) === key) {
    renderPath();               // 路径未变才重绘，避免竞态
  }
}
function updateRouteFail() {
  const btn = document.querySelector('#routeToggle [data-route="drive"]');
  if (btn) btn.classList.toggle('fail', routeFailed);
}
function fmtDur(s) {
  return s >= 3600 ? (s / 3600).toFixed(1) + ' h' : Math.round(s / 60) + ' min';
}
function addSegTip(a, b, text) {
  const tip = L.tooltip({
    permanent: true, direction: 'center', className: 'seg-tip', opacity: 1, interactive: false
  }).setLatLng([(a.lat + b.lat) / 2, (a.lng + b.lng) / 2]).setContent(text).addTo(map);
  pathLine.tips.push(tip);
}

function renderPath() {
  if (pathLine.line) { pathLine.line.remove(); pathLine.line = null; }
  pathLine.tips.forEach(t => t.remove()); pathLine.tips = [];

  const pts = state.path.map(byId).filter(Boolean);
  const key = routeKey(pts);
  const driveHit = state.routeMode === 'drive' && pts.length >= 2 && routeData && routeData.key === key;

  if (driveHit) {
    pathLine.line = L.polyline(routeData.geometry, {
      color: '#f2a33c', weight: 3, opacity: .95, className: 'drive-line', interactive: false
    }).addTo(map);
    for (let i = 0; i < pts.length - 1; i++) addSegTip(pts[i], pts[i + 1], fmtDist(routeData.legs[i] / 1000));
    $('#total').textContent = fmtDist(routeData.distance / 1000) + ' · ' + fmtDur(routeData.duration);
  } else {
    if (pts.length >= 2) {
      pathLine.line = L.polyline(pts.map(p => [p.lat, p.lng]), {
        color: '#f2a33c', weight: 2, opacity: .95,
        dashArray: '8 6', className: 'seg-line', interactive: false
      }).addTo(map);
      for (let i = 0; i < pts.length - 1; i++) addSegTip(pts[i], pts[i + 1], fmtDist(havKm(pts[i], pts[i + 1])));
    }
    const total = pts.reduce((s, p, i) => i ? s + havKm(pts[i - 1], p) : 0, 0);
    $('#total').textContent = pts.length >= 2 ? fmtDist(total) : '0';
    if (!draggingNow && state.routeMode === 'drive' && pts.length >= 2) fetchRouteAsync(key, pts);  // 拖动中不请求，先显示直线
  }
  // 侧栏行同步 in-path 状态
  document.querySelectorAll('.row').forEach(r => {
    const id = +r.dataset.id;
    r.classList.toggle('in-path', state.path.includes(id));
  });
}

/* ---------- 侧栏列表 ---------- */
function renderList() {
  const ul = $('#list');
  ul.innerHTML = '';
  $('#count').textContent = state.markers.length;
  if (!state.markers.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = state.mode === 'mark' ? '点击地图开始标注' : '暂无标注，先切换到标注模式';
    ul.appendChild(li);
    return;
  }
  for (const m of state.markers) {
    const li = document.createElement('li');
    li.className = 'row' + (state.path.includes(m.id) ? ' in-path' : '');
    li.dataset.id = m.id;
    li.innerHTML =
      '<span class="idx">' + m.id + '</span>' +
      '<div class="meta"><div class="name">' + escapeHtml(m.name) + '</div>' +
      '<div class="coords">' + fmtLatLng(m.lat, m.lng) + '</div></div>' +
      '<span class="acts"><button class="mini" data-act="rename">改名</button>' +
      '<button class="mini del" data-act="del">×</button></span>';
    ul.appendChild(li);
  }
}
function updateRowCoords(m) {
  const row = document.querySelector('.row[data-id="' + m.id + '"] .coords');
  if (row) row.textContent = fmtLatLng(m.lat, m.lng);
}

/* ---------- 交互 ---------- */
function setMode(mode) {
  state.mode = mode;
  document.body.classList.remove('mode-mark', 'mode-measure');
  document.body.classList.add('mode-' + mode);
  $('#modeMark').classList.toggle('active', mode === 'mark');
  $('#modeMeasure').classList.toggle('active', mode === 'measure');
  $('#measureCtl').hidden = mode !== 'measure';
  $('#hint').innerHTML = mode === 'mark'
    ? '点击地图任意位置添加标注，弹出框或侧栏可重命名；拖动标注微调位置。<b> Esc </b>切换模式'
    : '依次点击图上标注点绘制路径，<b>再次点击</b>路径中的点可移除；拖动标注，距离<b>实时刷新</b>。底部可切换<b>直线 / 驾驶</b>距离。';
  renderList();
}

let lastMapAdd = { t: 0, p: null };
map.on('click', e => {
  if (e.originalEvent && e.originalEvent.target.closest('.leaflet-marker-icon, .leaflet-popup')) return;
  if (state.mode !== 'mark') return;
  const now = Date.now();
  if (e.containerPoint && lastMapAdd.p &&
      now - lastMapAdd.t < 350 && lastMapAdd.p.distanceTo(e.containerPoint) < 18) return; // 双击去重
  lastMapAdd = { t: now, p: e.containerPoint ? L.point(e.containerPoint) : null };
  addMarker(e.latlng.lat, e.latlng.lng);
});

let lastMkClick = { id: null, t: 0 };
function onMarkerClick(id) {
  map.closePopup();
  if (state.mode === 'mark') {
    layer.get(id).openPopup();
    return;
  }
  // 测距模式：切换入/出路径
  const now = Date.now();
  if (lastMkClick.id === id && now - lastMkClick.t < 350) return; // 双击去重
  lastMkClick = { id, t: now };
  const i = state.path.indexOf(id);
  if (i >= 0) state.path.splice(i, 1);
  else state.path.push(id);
  refreshMarkerStyles(); renderPath(); save();
}

function addMarker(lat, lng, name) {
  const m = { id: state.next++, name: name || ('P' + (state.next - 1)), lat, lng };
  state.markers.push(m);
  createLayer(m);
  clearLocate();
  renderList(); renderPath(); save();
}

/* ---------- 地点搜索（Esri World Geocoder，免 key，仅英文） ---------- */
const searchInput = $('#searchInput'), searchResults = $('#searchResults');
let locateMarker = null;
function clearLocate() {
  if (locateMarker) { locateMarker.remove(); locateMarker = null; }
}
async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  searchResults.hidden = false;
  searchResults.innerHTML = '<li class="sr-status">搜索中…</li>';
  try {
    const url = 'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates' +
      '?singleLine=' + encodeURIComponent(q) + '&maxLocations=5&outSR=4326&f=json';
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const cands = d.candidates || [];
    if (!cands.length) {
      searchResults.innerHTML = '<li class="sr-status">无结果，试试英文地名</li>';
      return;
    }
    searchResults.innerHTML = '';
    cands.forEach(c => {
      const name = c.address || '';
      const short = name.split(',')[0] || name;
      const li = document.createElement('li');
      li.className = 'sr';
      li.innerHTML = '<span class="sr-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>' +
                     '<button class="mini" data-op="mark">＋标注</button>';
      li.addEventListener('click', e => {           // 点行 = 定位
        if (e.target.closest('[data-op="mark"]')) return;
        locateResult(c);
      });
      li.querySelector('[data-op="mark"]').addEventListener('click', () => {
        addMarker(c.location.y, c.location.x, short);
        searchResults.hidden = true;
      });
      searchResults.appendChild(li);
    });
    const foot = document.createElement('li');
    foot.className = 'sr-foot';
    foot.textContent = 'Geocoding © Esri';
    searchResults.appendChild(foot);
  } catch (e) {
    searchResults.innerHTML = '<li class="sr-status">搜索失败，网络或服务不可用</li>';
  }
}
function locateResult(c) {
  clearLocate();
  locateMarker = L.marker([c.location.y, c.location.x], {
    interactive: false,
    icon: L.divIcon({
      html: '<div class="cm-wrap"><div class="cm locate"><span class="ping"></span></div></div>',
      iconSize: [26, 26], iconAnchor: [13, 13]
    })
  }).addTo(map);
  if (c.extent) {
    map.flyToBounds([[c.extent.ymin, c.extent.xmin], [c.extent.ymax, c.extent.xmax]],
      { padding: [50, 50], maxZoom: 17, duration: .8 });
  } else {
    map.flyTo([c.location.y, c.location.x], 12, { duration: .8 });
  }
}
$('#searchBtn').addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function removeMarker(id) {
  const i = state.markers.findIndex(m => m.id === id);
  if (i < 0) return;
  state.markers.splice(i, 1);
  state.path = state.path.filter(x => x !== id);
  const mk = layer.get(id);
  if (mk) { mk.remove(); layer.delete(id); }
  map.closePopup();
  renderList(); refreshMarkerStyles(); renderPath(); save();
}

function renameMarker(id, name) {
  const m = byId(id);
  if (!m || !name) return;
  m.name = name;
  const mk = layer.get(id);
  if (mk && mk.isPopupOpen()) mk.getPopup().setContent(popupHtml(m));
  renderList(); save();
}

// 侧栏事件（委托）
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const id = +row.dataset.id;
  const m = byId(id);
  if (!m) return;
  if (e.target.closest('[data-act="del"]')) { removeMarker(id); return; }
  if (e.target.closest('[data-act="rename"]')) { startRowRename(row, m); return; }
  map.flyTo([m.lat, m.lng], Math.max(map.getZoom(), 5), { duration: .6 });
});
function startRowRename(row, m) {
  const nameEl = row.querySelector('.name');
  nameEl.innerHTML = '<input value="' + escapeHtml(m.name) + '">';
  const input = nameEl.firstChild;
  input.focus(); input.select();
  const commit = () => renameMarker(m.id, input.value.trim() || m.name);
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') commit();
    if (ev.key === 'Escape') renderList();
  });
  input.addEventListener('blur', commit);
}

// 弹窗事件（委托）
map.on('popupopen', e => {
  const root = e.popup.getElement();
  root.querySelector('[data-act="del"]').addEventListener('click', () => {
    removeMarker(+root.querySelector('.pop').dataset.id);
  });
  root.querySelector('[data-act="rename"]').addEventListener('click', () => {
    const nameEl = root.querySelector('.pop-name');
    nameEl.contentEditable = 'true'; nameEl.focus();
    const range = document.createRange(); range.selectNodeContents(nameEl);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    const commit = () => {
      nameEl.contentEditable = 'false';
      renameMarker(+root.querySelector('.pop').dataset.id, nameEl.textContent.trim());
    };
    nameEl.addEventListener('blur', commit, { once: true });
    nameEl.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); nameEl.blur(); }
    });
  });
});

$('#modeMark').addEventListener('click', () => setMode('mark'));
$('#modeMeasure').addEventListener('click', () => setMode('measure'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!searchResults.hidden) { searchResults.hidden = true; return; }
    setMode('mark');
  }
});
$('#undoPath').addEventListener('click', () => {
  state.path.pop(); refreshMarkerStyles(); renderPath(); save();
});
$('#clearPath').addEventListener('click', () => {
  state.path = []; refreshMarkerStyles(); renderPath(); save();
});
$('#clearAll').addEventListener('click', e => {
  if (e.target.dataset.confirm) {
    for (const m of [...state.markers]) removeMarker(m.id);
    e.target.dataset.confirm = ''; e.target.textContent = '清空全部标注';
  } else {                       // 二次点击确认，不用 confirm()
    e.target.dataset.confirm = '1'; e.target.textContent = '再次点击确认清空';
    setTimeout(() => { e.target.dataset.confirm = ''; e.target.textContent = '清空全部标注'; }, 2500);
  }
});

// 单位切换
$('#unitToggle').addEventListener('click', e => {
  const btn = e.target.closest('[data-unit]');
  if (!btn) return;
  state.unit = btn.dataset.unit;
  document.querySelectorAll('#unitToggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.unit === state.unit));
  renderPath(); save();
});

// 距离模式切换（直线 / 驾驶）
$('#routeToggle').addEventListener('click', e => {
  const btn = e.target.closest('[data-route]');
  if (!btn) return;
  state.routeMode = btn.dataset.route;
  document.querySelectorAll('#routeToggle button').forEach(b =>
    b.classList.toggle('active', b.dataset.route === state.routeMode));
  renderPath(); save();
});

// 光标坐标读出
map.on('mousemove', e => { $('#cursorPos').textContent = fmtLatLng(e.latlng.lat, e.latlng.lng); });
map.on('mouseout', () => { $('#cursorPos').textContent = '——'; });

/* ---------- 启动 ---------- */
load();
setBasemap(state.basemap);
for (const m of state.markers) createLayer(m);
setMode('mark');
document.querySelectorAll('#unitToggle button').forEach(b =>
  b.classList.toggle('active', b.dataset.unit === state.unit));
document.querySelectorAll('#routeToggle button').forEach(b =>
  b.classList.toggle('active', b.dataset.route === state.routeMode));
renderList(); renderPath();
fitAll();
</script>
</body>
</html>
