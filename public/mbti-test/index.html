<script>
const DIMENSIONS = ['EI', 'SN', 'TF', 'JP'];
const DIM_LABELS = { EI: ['E', 'I'], SN: ['S', 'N'], TF: ['T', 'F'], JP: ['J', 'P'] };
const LIKERT = [
  { v: -2, label: '非常不同意' },
  { v: -1, label: '不同意' },
  { v:  0, label: '中立' },
  { v:  1, label: '同意' },
  { v:  2, label: '非常同意' },
];

function computeResult(questions, answers) {
  const dims = {};
  for (const dim of DIMENSIONS) {
    let raw = 0;
    let max = 0;
    for (const q of questions) {
      if (q.dim !== dim) continue;
      const a = Math.max(-2, Math.min(2, answers[q.id] ?? 0));
      raw += a * q.dir;
      max += 2;
    }
    const [first, second] = DIM_LABELS[dim];
    const pole = raw > 0 ? first : second;   // tie-break：0 归第二极
    const pct = Math.round(50 + (max > 0 ? Math.abs(raw) / max * 50 : 0));
    dims[dim] = { pole, pct, raw };
  }
  const type = DIMENSIONS.map(d => dims[d].pole).join('');
  return { type, dims };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
</script>

    weaknesses: ['冲动，先干后想的代价不小', '不耐烦，讨厌开会谈感觉', '承诺来得快，兑现看心情'],
    careers: ['销售', '创业', '投资交易', '体育', '危机公关'],
    famous: ['欧内斯特·海明威', '麦当娜', '唐纳德·特朗普'],
    relationship: '和企业家相处，请跟上他的节奏，也学会踩刹车。他吃软不吃硬，撒娇比讲道理管用十倍。他表达爱是大方行动派：说带你去的就真带你去。吵架时别翻旧账，直接说"抱我"能解决八成矛盾。他需要一点崇拜感，多夸他，他真的会更好。',
  },
  ESFP: {
    code: 'ESFP', name: '表演者', tagline: '快乐是会传染的',
    desc: '你走到哪儿，哪儿就是舞台，笑声就是你的背景音乐。你天生会来事儿，讲个八卦都自带运镜和配音。对你来说人生就是要体验：好吃的第一口、好听的现场、好玩的时刻，比什么大道理都珍贵。你慷慨、热情、共情快，朋友的坏情绪到你这儿三分钟就能哄好。有人说你咋咋呼呼，其实你只是把"活在当下"执行得比别人彻底。跟你待在一起，很难不开心。',
    strengths: ['自带气氛组属性，快乐传染源', '慷慨大方，对朋友从不抠门', '共情快，安慰人一绝', '行动力强，想玩就约'],
    weaknesses: ['冲动消费的重灾区', '讨厌计划，长远的事往后拖', '太在意当下的热闹，独处会发慌'],
    careers: ['演艺主持', '直播', '活动执行', '旅游', '销售'],
    famous: ['玛丽莲·梦露', '艾尔顿·约翰', '贾斯汀·比伯'],
    relationship: '和表演者相处，请捧场——他讲笑话你就笑，他跳舞你就鼓掌，被看见就是他的氧气。他情绪来得快去得快，吵架别上纲上线，第二天他自己都忘了。用具体的陪伴爱他：一起去吃、一起去看、一起去疯。他闹哄哄的背后，其实最怕被冷落。',
  },
};
</script>
<!-- CONTENT-DATA-END -->

<script>
(function () {
  'use strict';
  var STORE_KEY = 'mbti-test-state';
  var app = document.getElementById('app');

  function newState() {
    return { v: 1, phase: 'welcome', order: shuffle(QUESTIONS.map(function (q) { return q.id; })),
             answers: {}, index: 0, result: null };
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s.v !== 1 || !Array.isArray(s.order) || s.order.length !== QUESTIONS.length) return null;
      return s;
    } catch (e) { return null; }
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  function clearStore() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  var state = loadState() || newState();
  var qById = {};
  QUESTIONS.forEach(function (q) { qById[q.id] = q; });

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs) {
      if (attrs[k] == null) continue;
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  function renderWelcome() {
    var screen = el('section', { 'data-testid': 'screen-welcome', 'class': 'screen screen-welcome' });
    screen.appendChild(el('p', { 'class': 'kicker', text: '六十题 · 约八分钟' }));
    screen.appendChild(el('h1', { 'class': 'title', html: '<em>MBTI</em> 性格测试' }));
    screen.appendChild(el('hr', { 'class': 'rule' }));
    screen.appendChild(el('p', { 'class': 'intro', text: '六十道题，没有对错，凭第一直觉作答。做完看看你是十六种人格里的哪一种。' }));
    var letters = el('div', { 'class': 'letters' });
    'EISNTFJP'.split('').forEach(function (ch) {
      letters.appendChild(el('span', { 'class': 'letter-chip', text: ch }));
    });
    screen.appendChild(letters);
    screen.appendChild(el('button', { 'data-testid': 'btn-start', 'class': 'btn-primary',
      onclick: function () { state.phase = 'quiz'; state.index = 0; save(); render(); }, text: '开始测试 →' }));
    screen.appendChild(el('p', { 'class': 'footnote', text: '结果可保存成卡片，发给朋友对照' }));
    app.innerHTML = '';
    app.appendChild(screen);
  }

  function renderQuiz() {
    var qId = state.order[state.index];
    var q = qById[qId];
    var answered = Object.keys(state.answers).length;
    var screen = el('section', { 'data-testid': 'screen-quiz', 'class': 'screen screen-quiz',
      'data-qnum': String(state.index + 1) });
    var folio = el('div', { 'class': 'folio' });
    folio.appendChild(el('span', { 'class': 'qno', text: '第 ' + (state.index + 1) + ' 题' }));
    folio.appendChild(el('span', { 'data-testid': 'progress-label', 'class': 'progress-label',
      text: (state.index + 1) + ' / ' + state.order.length }));
    screen.appendChild(folio);
    var barWrap = el('div', { 'class': 'progress-bar' });
    var pctDone = Math.round(answered / state.order.length * 100);
    barWrap.appendChild(el('div', { 'class': 'progress-fill', style: 'width:' + pctDone + '%' }));
    screen.appendChild(barWrap);
    screen.appendChild(el('h2', { 'data-testid': 'question-text', 'class': 'question', text: q.text }));

    var row = el('div', { 'class': 'likert' });
    LIKERT.forEach(function (opt) {
      var selected = state.answers[qId] === opt.v;
      row.appendChild(el('button', {
        'data-testid': 'likert-' + opt.v,
        'class': 'likert-btn' + (selected ? ' selected' : '') + (opt.v === 0 ? ' neutral' : ''),
        text: opt.label,
        onclick: function () { pick(opt.v); }
      }));
    });
    screen.appendChild(row);
    screen.appendChild(el('button', { 'data-testid': 'btn-prev', 'class': 'btn-ghost',
      text: '上一题', disabled: state.index === 0 ? 'disabled' : null,
      onclick: function () { if (state.index > 0) { state.index--; save(); render(); } } }));
    app.innerHTML = '';
    app.appendChild(screen);
  }

  var advanceTimer = null;
  function pick(v) {
    var qId = state.order[state.index];
    state.answers[qId] = v;
    save();
    // 清掉旧高亮再加新反馈（重答同题场景）
    document.querySelectorAll('.likert-btn').forEach(function (b) { b.classList.remove('selected'); });
    var btn = document.querySelector('[data-testid="likert-' + v + '"]');
    if (btn) btn.classList.add('selected');
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function () {
      if (state.index < state.order.length - 1) {
        state.index++; save(); render();
      } else {
        state.result = computeResult(QUESTIONS, state.answers);
        state.phase = 'result'; save(); render();
      }
    }, 200);
  }

  var CARD_STYLE = { bg: '#faf6ee', ink: '#1a1713', seal: '#c8401f', muted: '#6f675a',
                     line: '#ddd3bf', deep: '#f2ebdb', w: 750, h: 1000 };

  function drawShareCard(r) {
    var s = CARD_STYLE;
    var c = document.createElement('canvas');
    c.width = s.w; c.height = s.h;
    var ctx = c.getContext('2d');
    var SERIF = '"Songti SC", "STSong", "Noto Serif CJK SC", serif';
    ctx.fillStyle = s.bg; ctx.fillRect(0, 0, s.w, s.h);
    // 双线框：外粗朱砂、内细墨线
    ctx.strokeStyle = s.seal; ctx.lineWidth = 3; ctx.strokeRect(26, 26, s.w - 52, s.h - 52);
    ctx.strokeStyle = s.line; ctx.lineWidth = 1; ctx.strokeRect(40, 40, s.w - 80, s.h - 80);

    ctx.textAlign = 'center';
    ctx.fillStyle = s.ink; ctx.font = '600 24px ' + SERIF;
    ctx.fillText('M B T I  性 格 测 试', s.w / 2, 112);
    ctx.fillStyle = s.seal; ctx.font = '900 160px ' + SERIF;
    ctx.fillText(r.type, s.w / 2, 318);
    ctx.fillStyle = s.ink; ctx.font = '600 52px ' + SERIF;
    ctx.fillText(TYPES[r.type].name, s.w / 2, 418);
    ctx.fillStyle = s.muted; ctx.font = '400 30px ' + SERIF;
    ctx.fillText(TYPES[r.type].tagline, s.w / 2, 478);

    var y = 570;
    DIMENSIONS.forEach(function (dim) {
      var d = r.dims[dim];
      var first = DIM_LABELS[dim][0], second = DIM_LABELS[dim][1];
      var x0 = 120, x1 = s.w - 120;
      var w = (x1 - x0) * d.pct / 100;
      ctx.textAlign = 'right'; ctx.fillStyle = d.pole === first ? s.seal : s.muted;
      ctx.font = '700 38px ' + SERIF; ctx.fillText(first, x0 - 26, y + 15);
      ctx.textAlign = 'left'; ctx.fillStyle = d.pole === second ? s.seal : s.muted;
      ctx.fillText(second, x1 + 26, y + 15);
      ctx.fillStyle = s.deep; ctx.fillRect(x0, y, x1 - x0, 14);
      ctx.strokeStyle = s.line; ctx.lineWidth = 1; ctx.strokeRect(x0 + .5, y + .5, x1 - x0 - 1, 13);
      // 色块贴获胜一极：第一极贴左，第二极贴右
      ctx.fillStyle = s.seal;
      if (d.pole === first) ctx.fillRect(x0 + 2, y + 2, w - 4, 10);
      else ctx.fillRect(x1 - 2 - (w - 4), y + 2, w - 4, 10);
      ctx.textAlign = 'center'; ctx.fillStyle = s.ink; ctx.font = '600 27px ' + SERIF;
      ctx.fillText(d.pole + ' ' + d.pct + '%', s.w / 2, y + 56);
      y += 96;
    });

    ctx.textAlign = 'center'; ctx.fillStyle = s.muted; ctx.font = '400 24px ' + SERIF;
    ctx.fillText('长按保存 · 发给朋友看看准不准', s.w / 2, 948);
    return c.toDataURL('image/png');
  }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: 'image/png' });
  }

  function shareCard() {
    var dataUrl = drawShareCard(state.result);
    var btn = document.querySelector('[data-testid="btn-share"]');
    var file = null;
    try { file = new File([dataUrlToBlob(dataUrl)], 'mbti-' + state.result.type + '.png', { type: 'image/png' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '我的 MBTI 是 ' + state.result.type }).catch(function () {});
      return;
    }
    var wrap = el('div', { 'class': 'share-wrap' });
    wrap.appendChild(el('img', { 'data-testid': 'share-img', 'class': 'share-img', src: dataUrl, alt: 'MBTI 分享卡片' }));
    wrap.appendChild(el('a', { 'data-testid': 'share-download', 'class': 'btn-primary', download: 'mbti-' + state.result.type + '.png',
      href: dataUrl, text: '下载卡片' }));
    btn.replaceWith(wrap);
  }

  function renderResult() {
    var r = state.result;
    var p = TYPES[r.type];
    var screen = el('section', { 'data-testid': 'screen-result', 'class': 'screen screen-result' });
    var hero = el('div', { 'class': 'result-hero' });
    hero.appendChild(el('div', { 'data-testid': 'type-code', 'class': 'type-code', text: r.type }));
    hero.appendChild(el('div', { 'data-testid': 'type-name', 'class': 'type-name', text: p.name + ' · ' + p.tagline }));
    screen.appendChild(hero);

    var dimBlock = el('div', { 'class': 'dim-block' });
    DIMENSIONS.forEach(function (dim) {
      var d = r.dims[dim];
      var row = el('div', { 'data-testid': 'dim-' + dim, 'class': 'dim-row' });
      var first = DIM_LABELS[dim][0], second = DIM_LABELS[dim][1];
      // 色块贴获胜一极：第一极贴左，第二极贴右
      var fillStyle = d.pole === first
        ? 'width:' + d.pct + '%'
        : 'width:' + d.pct + '%;margin-left:auto';
      var track = el('div', { 'class': 'dim-track' });
      track.appendChild(el('div', { 'class': 'dim-fill', style: fillStyle }));
      row.appendChild(el('span', { 'class': 'dim-letter' + (d.pole === first ? ' win' : ''), text: first }));
      row.appendChild(track);
      row.appendChild(el('span', { 'class': 'dim-letter' + (d.pole === second ? ' win' : ''), text: second }));
      row.appendChild(el('span', { 'class': 'dim-pct', text: d.pole + ' ' + d.pct + '%' }));
      dimBlock.appendChild(row);
    });
    screen.appendChild(dimBlock);

    var SEC_NO = ['壹', '贰', '叁', '肆', '伍', '陆'];
    function secHead(title) {
      var h = el('div', { 'class': 'sec-head' });
      h.appendChild(el('span', { 'class': 'sec-no', text: SEC_NO[secHead.i++] }));
      h.appendChild(el('span', { 'class': 'sec-title', text: title }));
      h.appendChild(el('span', { 'class': 'sec-rule' }));
      return h;
    }
    secHead.i = 0;

    screen.appendChild(secHead('你是这样的 ' + p.name));
    screen.appendChild(el('p', { 'class': 'desc', text: p.desc }));
    screen.appendChild(secHead('优势'));
    screen.appendChild(el('ul', { 'class': 'plainlist',
      html: p.strengths.map(function (s) { return '<li>' + s + '</li>'; }).join('') }));
    screen.appendChild(secHead('要留意'));
    screen.appendChild(el('ul', { 'class': 'plainlist',
      html: p.weaknesses.map(function (s) { return '<li>' + s + '</li>'; }).join('') }));
    screen.appendChild(secHead('适合的方向'));
    screen.appendChild(el('p', { 'class': 'plain', text: p.careers.join(' · ') }));
    screen.appendChild(secHead('同款名人'));
    screen.appendChild(el('p', { 'class': 'plain', text: p.famous.join(' · ') }));
    screen.appendChild(secHead('和 ' + p.name + ' 相处'));
    screen.appendChild(el('p', { 'class': 'desc', text: p.relationship }));

    screen.appendChild(el('button', { 'data-testid': 'btn-share', 'class': 'btn-primary',
      onclick: function () { shareCard(); }, text: '生成分享卡片' }));
    screen.appendChild(el('button', { 'data-testid': 'btn-restart', 'class': 'btn-ghost center',
      onclick: function () { clearStore(); state = newState(); render(); }, text: '重新测试' }));
    app.innerHTML = '';
    app.appendChild(screen);
  }

  function render() {
    clearTimeout(advanceTimer);
    if (state.phase === 'quiz') renderQuiz();
    else if (state.phase === 'result' && state.result) renderResult();
    else renderWelcome();
  }
  render();
})();
</script>
</body>
</html>
