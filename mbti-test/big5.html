<script>
const DIM5 = ['O', 'C', 'E', 'A', 'N'];
const FACETS = {
  N: ['N1', 'N2', 'N3', 'N4', 'N5', 'N6'],
  E: ['E1', 'E2', 'E3', 'E4', 'E5', 'E6'],
  O: ['O1', 'O2', 'O3', 'O4', 'O5', 'O6'],
  A: ['A1', 'A2', 'A3', 'A4', 'A5', 'A6'],
  C: ['C1', 'C2', 'C3', 'C4', 'C5', 'C6'],
};
const LIKERT5 = [
  { v: 1, label: '非常不准确' },
  { v: 2, label: '比较不准确' },
  { v: 3, label: '既不准确也不不准确' },
  { v: 4, label: '比较准确' },
  { v: 5, label: '非常准确' },
];

function bandOf(T) {
  return T < 30 ? '很低' : T < 45 ? '低' : T <= 55 ? '中' : T <= 70 ? '高' : '很高';
}

function computeBig5(questions, norms, answers) {
  const facets = {}, domains = {};
  for (const d of DIM5) {
    let dRaw = 0;
    for (const f of FACETS[d]) {
      let fRaw = 0;
      for (const q of questions) {
        if (q.facet !== f) continue;
        const a = Math.max(1, Math.min(5, answers[q.id] ?? 3));
        const s = q.rev ? 6 - a : a;
        fRaw += s; dRaw += s;
      }
      const { M, SD } = norms.facets[f];
      const T = Math.round((50 + 10 * (fRaw - M) / SD) * 10) / 10;
      facets[f] = { raw: fRaw, T, band: bandOf(T) };
    }
    const { M, SD } = norms.domains[d];
    const T = Math.round((50 + 10 * (dRaw - M) / SD) * 10) / 10;
    domains[d] = { raw: dRaw, T, band: bandOf(T) };
  }
  return { domains, facets };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
</script>

      low: '你对新关系慢热甚至警惕：交情需要时间发酵，你不做表面功夫。你的朋友不多但都过硬，只是别让"慢热"挡住真正值得的人。',

    E2: {

      low: '你天然偏好小圈子或独处：人声鼎沸的地方待久了反而空虚。三两深交胜过满场泛交，这是你的社交经济学，成立。',

    E3: {

    E4: {

      low: '你偏好低耗节奏：慢生活、留白、不赶。你不是懒，是不愿把力气花在瞎忙上。该冲刺时你也能顶上去，这就是够用的强度。',
    },
    E5: {

      low: '你偏好确定和安稳：刺激对你更像消耗而非享受。稳扎稳打是你的长期优势，只是偶尔的未知里也藏着礼物，别一律拒收。',
    },
    E6: {
      high: '你的快乐是外放的：笑点低、兴致高、容易把气氛带起来。这种感染力是稀缺资源，也是你抵御低谷的本钱。低落时不强迫自己振作，快乐会自己回来。',
      low: '你的快乐是内敛的：满足更多是安静的感受而非外显的兴奋。不容易兴奋不代表不幸福，只是你的快乐波长比较长。',
    },
    O1: {
      high: '你的脑内世界人口稠密：白日梦、假设、"如果怎样怎样"是你的日常娱乐。创造力从这里来，注意力也从这里漏——重要场合给脑子系根绳。',
      low: '你活在具体里：想法要落地才算数，空想让你不耐烦。执行型的清醒在你这里，世界靠你们把幻想变成桥。',
    },
    O2: {
      high: '美对你不是装饰是必需：音乐、文字、画面、光影都能真实地击中你。审美是你的操作系统之一，别让生计把它挤到没有位置。',
      low: '艺术于你是可选项而非刚需：你更在意东西有没有用。这没问题，只是偶尔的美学体验成本很低，回报常常意外。',
    },
    O3: {
      high: '你对情绪的感知是高清的：自己的、别人的，都能捕捉到细颗粒度。共情是你的天赋，也意味着别人的情绪会真实消耗你——学会关掉接收器是必修课。',
      low: '你靠事实而非感受做判断：情绪信号弱，冷静是你的默认。理性可靠，但偶尔读一读自己的情绪，能帮你发现理性迟到的问题。',
    },
    O4: {
      high: '熟悉的路你走不住：新地方、新菜式、新方法自带吸引力。你的舒适区比别人大，适应力是你的竞争力，只是别把"还没试过"直接等于"更好"。',
      low: '你偏好已知与稳定：老店、老方法、固定的路线是你的舒适区。稳定是你的护城河，但一年一两次的小出轨，通常不会要你的命。',
    },
    O5: {
      high: '你喜欢啃硬东西：复杂的概念、烧脑的讨论、读起来费劲的书，对你是乐趣而非任务。思辨是你的娱乐方式，注意把想清楚的成果做出来，别停在颅内高潮。',
      low: '你偏好具体实用的问题：抽象讨论让你犯困。动手能力和常识是你的强项，理论的部分，让爱理论的人替你读就好。',
    },
    O6: {
      high: '你对权威和传统天然存疑，愿意为少数立场留空间，接受世界没有标准答案。开放是你的底色，也记得：跟你立场不同的人未必愚昧，只是前提不同。',
      low: '你尊重传统与秩序，相信有对的答案和该守的规矩。稳定的价值观给你定力，只需留意"一直都是这样"有时正是需要被检查的地方。',
    },
    A1: {
      high: '你默认人是可信的：不设防、先给善意。合作在你这里成本低、启动快，但吃过一两回亏之后，你会学会"信任，但要核对"。',
      low: '你默认怀疑：别人的动机和承诺，你都要先验证。谨慎让你很少被骗，但防备本身有成本——把怀疑留给证据，而不是人。',
    },
    A2: {
      high: '你拒绝把人当工具：不占便宜、不耍手段，哪怕有机会。这是你信用账户的本金——人们把重要的事，交给靠得住的人。',
      low: '在自利和手段上你给自己留的空间较大：灵活是灵活，但信用一旦破产，重建的成本远超当初省下的那点力气。',
    },
    A3: {
      high: '帮人对你是需要而非负担：别人的事你真的上心。世界靠你这样的人运转，但先把自己的氧气面罩戴好——耗尽的善意谁也续不上。',
      low: '你先把资源留给自己和眼前的事：帮助是选择而非义务。健康的边界感没错，只是偶尔的举手之劳，回报周期比你想的短。',
    },
    A4: {
      high: '你天生避战：摩擦当前，你的第一反应是降温而不是加码。你是团队的减震器，但该拍的桌子不拍，问题会在别处爆炸。',
      low: '冲突对你不是禁忌：该争就争、该怼就怼。敢于交锋是稀缺能力，只是把每次分歧都打成遭遇战，盟友会变少——挑真正值得打的仗。',
    },
    A5: {
      high: '你把自己放得低：功劳让出去、镜头让出去。谦逊攒人心，但别谦到隐形——你的贡献需要被看见，才有下一次机会。',
      low: '你清楚自己的分量，并且不介意让人知道。自信是好事，只是"我很强"和"别人都不行"之间有条线，别踩过去。',
    },
    A6: {
      high: '别人的苦难会真实地硌到你：新闻里的、路上的、朋友的。柔软是你的出厂设置，它让你成为好的朋友，但情绪上别替全世界扛。',
      low: '你对苦难的回应偏理性：先问原因和办法，而不是先难受。冷静的善意同样珍贵——出钱出力你未必少，只是不走心口那条路。',
    },
    C1: {
      high: '你对自己的能力有实打实的信心：事情来了先想怎么干成，而不是能不能成。底气来自过往战绩，它让你敢接难的活。和盲目自信的分界靠复盘习惯来守。',
      low: '你常怀疑自己能不能干好：机会面前先看到自己不够的地方。持续的自我怀疑有时比能力本身更拖后腿——记录你做成过的事，数据比感觉可靠。',
    },
    C2: {
      high: '东西有位置、事情有清单、日程有格子，秩序给你安全感。你的系统让产出可复用、可交接。对混乱的低容忍是软肋——世界不会永远整齐。',
      low: '你的桌面和文件夹像考古现场，但混乱中有你自己的索引。找东西慢一点是你付的租金，换来的灵活不亏——只是重要文件，还是备份一下。',
    },
    C3: {
      high: '承诺对你有分量：答应了就办，规则内行事是默认。你是那种把钥匙交给他就能睡好觉的人——这份可靠，是值得每个合作者珍惜的信用资产。',
      low: '规则对你更像建议：能绕就绕、能变通就变通。灵活有时真能解决问题，但透支承诺的代价是——下次你说什么，别人先打折扣。',
    },
    C4: {
      high: '"差不多"不在你的词典里：标准总比要求高一截，做成的事是你的多巴胺来源。成就动机是你的引擎，但引擎也需要停机保养——不休息的代价是燃烧自己。',
      low: '你对往上冲没有执念：够用就好、舒服重要。你躲开了内卷的消耗，只是长期看，一两件真正想做成的事，值得你调高火力试一次。',
    },
    C5: {
      high: '你说做就做：计划不会躺在待办清单里发霉，坚持是你的常态。你是那种新年计划真能立住的人。自律是你的复利账户，但别用它绑架身边人的节奏。',
      low: '开始难、坚持更难：好计划常死于第三天。别急着骂自己意志力——把目标切小、把干扰拿走、让环境推着你走，比硬扛有效十倍。',
    },
    C6: {
      high: '三思而后行是你的出厂设置：决定慢，是因为你把后果都过了一遍。你很少踩大坑，这份谨慎是护城河——但机会有时比风险更不耐等。',
      low: '你行动先于思考：先干起来再调整是你的风格。速度是优势，学费是账单——不可逆的事（钱、辞职、发出去的话），值得多想三十秒。',
    },
  },
  facetMid: '你的这项特质居中：它会随情境和状态波动，而不是稳定的偏高或偏低。对照自己"什么时候高、什么时候低"，往往比分数本身更有信息量。',
};

<script>
(function () {
  'use strict';
  var STORE_KEY = 'big5-test-state';
  var app = document.getElementById('app');

  var DIM_INFO = {
    O: { name: '开放性', en: 'Openness', intro: '对新观念、审美与变化的胃口' },
    C: { name: '尽责性', en: 'Conscientiousness', intro: '计划、坚持与把事办成的能力' },
    E: { name: '外向性', en: 'Extraversion', intro: '能量朝向人与外部世界的程度' },
    A: { name: '宜人性', en: 'Agreeableness', intro: '合作与体谅的默认设置' },
    N: { name: '神经质', en: 'Neuroticism', intro: '负面情绪的敏感度与恢复速度' },
  };
  var FACET_INFO = {
    N1: '焦虑', N2: '愤怒', N3: '抑郁', N4: '自我意识', N5: '无节制', N6: '脆弱性',
    E1: '友善', E2: '合群', E3: '坚定', E4: '活力', E5: '求刺激', E6: '愉悦',
    O1: '想象力', O2: '艺术兴趣', O3: '情感体验', O4: '求新', O5: '智性', O6: '价值观开放',
    A1: '信任', A2: '直率', A3: '利他', A4: '合作', A5: '谦逊', A6: '同情',
    C1: '自我效能', C2: '条理', C3: '责任', C4: '成就追求', C5: '自律', C6: '审慎',
  };

  function newState() {
    return { v: 1, phase: 'welcome', order: shuffle(QUESTIONS.map(function (q) { return q.id; })),
             answers: {}, index: 0, result: null };
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s.v !== 1 || !Array.isArray(s.order) || s.order.length !== QUESTIONS.length) return null;
      return s;
    } catch (e) { return null; }
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  function clearStore() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  var state = loadState() || newState();
  var qById = {};
  QUESTIONS.forEach(function (q) { qById[q.id] = q; });

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs) {
      if (attrs[k] == null) continue;
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'html') node.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  function renderWelcome() {
    var screen = el('section', { 'data-testid': 'screen-welcome', 'class': 'screen screen-welcome' });
    screen.appendChild(el('p', { 'class': 'kicker', text: '120 题 · 约 20 分钟 · 学界标准模型' }));
    screen.appendChild(el('h1', { 'class': 'title', html: '大五人格<em>专业版</em>' }));
    screen.appendChild(el('hr', { 'class': 'rule' }));
    screen.appendChild(el('p', { 'class': 'intro',
      text: '基于公有领域题库 IPIP-NEO-120：五个大维度、三十个子特质，给出对标常模的 T 分数报告。凭自己的日常印象作答，不要想"正确答案"。' }));
    var letters = el('div', { 'class': 'letters' });
    'OCEAN'.split('').forEach(function (ch) {
      letters.appendChild(el('span', { 'class': 'letter-chip', text: ch }));
    });
    screen.appendChild(letters);
    screen.appendChild(el('button', { 'data-testid': 'btn-start', 'class': 'btn-primary',
      onclick: function () { state.phase = 'quiz'; state.index = 0; save(); render(); }, text: '开始测试 →' }));
    screen.appendChild(el('p', { 'class': 'footnote', html:
      '常模为在线自选样本（n≈3,011），T 分对标该样本 · 非临床工具<br>' +
      '<a data-testid="link-mbti" href="index.html">只想轻松玩？试试 MBTI 十六型人格 →</a>' }));
    app.innerHTML = '';
    app.appendChild(screen);
  }

  function renderQuiz() {
    var qId = state.order[state.index];
    var q = qById[qId];
    var answered = Object.keys(state.answers).length;
    var screen = el('section', { 'data-testid': 'screen-quiz', 'class': 'screen screen-quiz',
      'data-qnum': String(state.index + 1) });
    var folio = el('div', { 'class': 'folio' });
    folio.appendChild(el('span', { 'class': 'qno', text: '第 ' + (state.index + 1) + ' 题' }));
    folio.appendChild(el('span', { 'data-testid': 'progress-label', 'class': 'progress-label',
      text: (state.index + 1) + ' / ' + state.order.length }));
    screen.appendChild(folio);
    var barWrap = el('div', { 'class': 'progress-bar' });
    var pctDone = Math.round(answered / state.order.length * 100);
    barWrap.appendChild(el('div', { 'class': 'progress-fill', style: 'width:' + pctDone + '%' }));
    screen.appendChild(barWrap);
    screen.appendChild(el('h2', { 'data-testid': 'question-text', 'class': 'question', text: q.zh }));

    var row = el('div', { 'class': 'likert' });
    LIKERT5.forEach(function (opt) {
      var selected = state.answers[qId] === opt.v;
      row.appendChild(el('button', {
        'data-testid': 'likert-' + opt.v,
        'class': 'likert-btn' + (selected ? ' selected' : '') + (opt.v === 3 ? ' neutral' : ''),
        text: opt.label,
        onclick: function () { pick(opt.v); }
      }));
    });
    screen.appendChild(row);
    screen.appendChild(el('button', { 'data-testid': 'btn-prev', 'class': 'btn-ghost',
      text: '上一题', disabled: state.index === 0 ? 'disabled' : null,
      onclick: function () { if (state.index > 0) { state.index--; save(); render(); } } }));
    app.innerHTML = '';
    app.appendChild(screen);
  }

  var advanceTimer = null;
  function pick(v) {
    var qId = state.order[state.index];
    state.answers[qId] = v;
    save();
    document.querySelectorAll('.likert-btn').forEach(function (b) { b.classList.remove('selected'); });
    var btn = document.querySelector('[data-testid="likert-' + v + '"]');
    if (btn) btn.classList.add('selected');
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(function () {
      if (state.index < state.order.length - 1) {
        state.index++; save(); render();
      } else {
        state.result = computeBig5(QUESTIONS, NORMS, state.answers);
        state.phase = 'result'; save(); render();
      }
    }, 200);
  }

  function tbar(T) {
    var pct = Math.max(0, Math.min(100, T));
    var wrap = el('div', { 'class': 'tbar' });
    wrap.appendChild(el('div', { 'class': 'tbar-fill', style: 'width:' + pct + '%' }));
    wrap.appendChild(el('div', { 'class': 'tbar-mid' }));
    return wrap;
  }

  function renderResult() {
    var r = state.result;
    var screen = el('section', { 'data-testid': 'screen-result', 'class': 'screen screen-result' });
    var hero = el('div', { 'class': 'report-hero' });
    hero.appendChild(el('h1', { 'class': 'report-title', text: '你的大五人格剖面' }));
    hero.appendChild(el('p', { 'class': 'report-sub',
      text: 'IPIP-NEO-120 · T 分对标在线常模（50 为常模均值）' }));
    screen.appendChild(hero);

    // 五域总分
    var domainBlock = el('div', { 'class': 'domain-block' });
    DIM5.forEach(function (d) {
      var dd = r.domains[d];
      var info = DIM_INFO[d];
      var bucket = dd.T >= 55 ? 'high' : dd.T < 45 ? 'low' : 'mid';
      var card = el('div', { 'data-testid': 'report-domain-' + d, 'class': 'domain-card' });
      var head = el('div', { 'class': 'domain-head' });
      var name = el('span', { 'class': 'domain-name', html: info.name + ' <span class="en">' + info.en + '</span>' });
      head.appendChild(name);
      var tEl = el('span', { 'class': 'domain-t' });
      tEl.appendChild(el('span', { 'class': 'tval', text: dd.T.toFixed(1) }));
      tEl.appendChild(el('span', { text: ' ' }));
      tEl.appendChild(el('span', { 'class': 'domain-band', text: dd.band }));
      head.appendChild(tEl);
      card.appendChild(head);
      card.appendChild(tbar(dd.T));
      var scale = el('div', { 'class': 'tbar-scale' });
      scale.appendChild(el('span', { text: '0' }));
      scale.appendChild(el('span', { text: 'T 50' }));
      scale.appendChild(el('span', { text: '100' }));
      card.appendChild(scale);
      card.appendChild(el('p', { 'class': 'domain-desc', text: REPORT_TEXT.domains[d][bucket] }));

      // 域内 6 facet
      FACETS[d].forEach(function (f) {
        var fd = r.facets[f];
        var fBucket = fd.T >= 55 ? 'high' : fd.T < 45 ? 'low' : 'mid';
        var row = el('div', { 'data-testid': 'report-facet-' + f, 'class': 'facet-row' });
        var fHead = el('div', { 'class': 'facet-head' });
        fHead.appendChild(el('span', { 'class': 'facet-name', text: FACET_INFO[f] }));
        fHead.appendChild(el('span', { 'class': 'facet-t', text: 'T ' + fd.T.toFixed(1) + ' · ' + fd.band }));
        row.appendChild(fHead);
        var bar = el('div', { 'class': 'facet-bar' });
        bar.appendChild(el('div', { 'class': 'facet-bar-fill',
          style: 'width:' + Math.max(0, Math.min(100, fd.T)) + '%' }));
        row.appendChild(bar);
        row.appendChild(el('p', { 'class': 'facet-desc',
          text: fBucket === 'mid' ? REPORT_TEXT.facetMid : REPORT_TEXT.facets[f][fBucket] }));
        card.appendChild(row);
      });
      domainBlock.appendChild(card);
    });
    screen.appendChild(domainBlock);

    // 方法学披露
    screen.appendChild(el('div', { 'class': 'sec-head' }));
    var sec = screen.lastChild;
    sec.appendChild(el('span', { 'class': 'sec-no', text: '方法学与边界' }));
    sec.appendChild(el('span', { 'class': 'sec-rule' }));
    var method = el('div', { 'class': 'method' });
    method.appendChild(el('h4', { text: '这份报告是怎么来的' }));
    method.appendChild(el('ul', { html:
      '<li>题库：IPIP-NEO-120（Johnson, 2014），国际人格题库（IPIP）公有领域量表；中文为基于英文原文的自译，未做回译校验。</li>' +
      '<li>计分：反向题反转后求和，facet 4–20、域 24–120；T 分 = 50 + 10 × (raw − M) / SD。</li>' +
      '<li>常模：ipipneo.org / JobCannon 技术手册（CC BY 4.0），n≈3,011 的在线自选样本——不是全国概率样本，也非中国常模；你的 T 分对标的是"会上网做人格测试的这群人"。</li>' +
      '<li>档位：很低 &lt;30 / 低 30–45 / 中 45–55 / 高 55–70 / 很高 &gt;70（T 分刻度）。</li>' +
      '<li>边界：这是严肃的自评工具，不是临床诊断；四题的子特质测量误差不小，facet 分数读趋势即可，别抠小数点。</li>' }));
    screen.appendChild(method);

    screen.appendChild(el('button', { 'data-testid': 'btn-share', 'class': 'btn-primary',
      onclick: function () { shareCard(); }, text: '生成分享卡片' }));
    screen.appendChild(el('button', { 'data-testid': 'btn-restart', 'class': 'btn-ghost center',
      onclick: function () { clearStore(); state = newState(); render(); }, text: '重新测试' }));
    app.innerHTML = '';
    app.appendChild(screen);
  }

  var CARD_STYLE = { bg: '#faf6ee', ink: '#1a1713', accent: '#1f3a5f', muted: '#6f675a',
                     line: '#ddd3bf', deep: '#f2ebdb', w: 750, h: 1000 };

  function drawShareCard(r) {
    var s = CARD_STYLE;
    var c = document.createElement('canvas');
    c.width = s.w; c.height = s.h;
    var ctx = c.getContext('2d');
    var SERIF = '"Songti SC", "STSong", "Noto Serif CJK SC", serif';
    ctx.fillStyle = s.bg; ctx.fillRect(0, 0, s.w, s.h);
    ctx.strokeStyle = s.accent; ctx.lineWidth = 3; ctx.strokeRect(26, 26, s.w - 52, s.h - 52);
    ctx.strokeStyle = s.line; ctx.lineWidth = 1; ctx.strokeRect(40, 40, s.w - 80, s.h - 80);

    ctx.textAlign = 'center';
    ctx.fillStyle = s.ink; ctx.font = '600 24px ' + SERIF;
    ctx.fillText('大 五 人 格 · IPIP-NEO-120', s.w / 2, 108);
    ctx.fillStyle = s.muted; ctx.font = '400 26px ' + SERIF;
    ctx.fillText('T 分对标在线常模 · 50 为均值', s.w / 2, 170);

    var y = 280;
    var rowH = 132;
    DIM5.forEach(function (d) {
      var dd = r.domains[d];
      var info = DIM_INFO[d];
      ctx.textAlign = 'left'; ctx.fillStyle = s.ink;
      ctx.font = '700 40px ' + SERIF; ctx.fillText(info.name, 80, y + 14);
      ctx.fillStyle = s.muted; ctx.font = '400 22px ' + SERIF;
      ctx.fillText(info.en, 82, y + 46);
      var x0 = 320, x1 = 560;
      ctx.fillStyle = s.deep; ctx.fillRect(x0, y - 4, x1 - x0, 18);
      ctx.strokeStyle = s.line; ctx.lineWidth = 1; ctx.strokeRect(x0 + .5, y - 3.5, x1 - x0 - 1, 17);
      var w = (x1 - x0) * Math.max(0, Math.min(100, dd.T)) / 100;
      ctx.fillStyle = s.accent; ctx.fillRect(x0, y - 4, w, 18);
      ctx.strokeStyle = s.muted; ctx.beginPath();
      ctx.moveTo(x0 + (x1 - x0) / 2, y - 12); ctx.lineTo(x0 + (x1 - x0) / 2, y + 22); ctx.stroke();
      ctx.textAlign = 'right'; ctx.fillStyle = s.ink;
      ctx.font = '800 44px ' + SERIF; ctx.fillText(dd.T.toFixed(0), 670, y + 16);
      ctx.textAlign = 'left'; ctx.fillStyle = s.muted; ctx.font = '400 22px ' + SERIF;
      ctx.fillText(dd.band, 596, y + 46);
      y += rowH;
    });

    ctx.textAlign = 'center'; ctx.fillStyle = s.muted; ctx.font = '400 24px ' + SERIF;
    ctx.fillText('长按保存 · 在线样本常模（n≈3,011）· 非临床', s.w / 2, 948);
    return c.toDataURL('image/png');
  }

  function dataUrlToBlob(dataUrl) {
    var parts = dataUrl.split(',');
    var bin = atob(parts[1]);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: 'image/png' });
  }

  function shareCard() {
    var dataUrl = drawShareCard(state.result);
    var btn = document.querySelector('[data-testid="btn-share"]');
    var file = null;
    try { file = new File([dataUrlToBlob(dataUrl)], 'big5-' + Date.now() + '.png', { type: 'image/png' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '我的大五人格剖面' }).catch(function () {});
      return;
    }
    var wrap = el('div', { 'class': 'share-wrap' });
    wrap.appendChild(el('img', { 'data-testid': 'share-img', 'class': 'share-img', src: dataUrl, alt: '大五人格分享卡片' }));
    wrap.appendChild(el('a', { 'data-testid': 'share-download', 'class': 'btn-primary', download: 'big5-profile.png',
      href: dataUrl, text: '下载卡片' }));
    btn.replaceWith(wrap);
  }

  function render() {
    clearTimeout(advanceTimer);
    if (state.phase === 'quiz') renderQuiz();
    else if (state.phase === 'result' && state.result) renderResult();
    else renderWelcome();
  }
  render();
})();
</script>
</body>
</html>
